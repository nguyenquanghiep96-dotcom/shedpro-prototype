<style id="v2-mobile-override">
@media (max-width: 991px) {
    /* Phase 1: Fix Canvas Overlay */
    .v2-mobile-canvas-overlay > div {
        max-width: none !important;
    }
    #text-size-canvas,
    #mobile-submit-quote-btn {
        display: none !important;
    }

    /* Phase 2: Hide Original Elements */
    #ssb-configurator,
    .ssb-configurator-shed-type {
        display: none !important;
    }

    /* Phase 2: Horizontal Tab Bar */
    .v2-mobile-tabs-container {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #fff;
        border-bottom: 1px solid #E0E0E0;
        margin: 0 -15px;
        padding: 0 15px;
    }
    .v2-mobile-tabs-scroll {
        display: flex;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }
    .v2-mobile-tabs-scroll::-webkit-scrollbar {
        display: none;
    }
    .v2-mobile-tab {
        padding: 12px 16px;
        font-family: 'Proxima Nova', sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: #5E6578;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        text-transform: capitalize;
        flex-shrink: 0;
    }
    .v2-mobile-tab.active {
        color: #FF7048;
        border-bottom: 2px solid #FF7048;
    }

    /* Phase 3: Tab Content Areas */
    .v2-mobile-tab-content-area {
        display: none;
        padding: 16px 0;
    }
    .v2-mobile-tab-content-area.active {
        display: block;
    }

    /* Style Tab - Filter Row */
    .v2-mobile-filter-row {
        display: flex;
        overflow-x: auto;
        gap: 8px;
        margin-bottom: 16px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 4px;
    }
    .v2-mobile-filter-row::-webkit-scrollbar {
        display: none;
    }
    .v2-mobile-filter-pill {
        border-radius: 20px;
        padding: 6px 16px;
        border: 1px solid #E0E0E0;
        background: #fff;
        color: #5E6578;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        flex-shrink: 0;
    }
    .v2-mobile-filter-pill.active {
        background: #2B3B63;
        color: #fff;
        border-color: #2B3B63;
    }

    /* Style Tab - Grid */
    .v2-mobile-grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
    }
    .v2-mobile-style-card {
        border: 1px solid #E0E0E0;
        border-radius: 8px;
        overflow: hidden;
        text-align: center;
        padding: 4px;
        position: relative;
        cursor: pointer;
        background: #fff;
    }
    .v2-mobile-style-card.active {
        border: 2px solid #FF7048;
        padding: 3px;
    }
    .v2-mobile-style-card.active::after {
        content: '✓';
        position: absolute;
        top: 4px;
        right: 4px;
        background: #FF7048;
        color: white;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
    }
    .v2-mobile-style-card img {
        width: 100%;
        height: auto;
        border-radius: 4px;
        display: block;
    }
    .v2-mobile-style-card span {
        display: block;
        font-size: 10px;
        font-weight: 600;
        color: #5E6578;
        margin-top: 4px;
        line-height: 1.2;
        word-wrap: break-word;
        white-space: normal;
    }

    /* Size Tab */
    .v2-mobile-size-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }
    .v2-mobile-size-card {
        border: 1px solid #E0E0E0;
        border-radius: 8px;
        padding: 14px 12px;
        text-align: center;
        cursor: pointer;
        font-weight: 600;
        color: #2B3B63;
        font-size: 14px;
        background: #fff;
    }
    .v2-mobile-size-card.active {
        border: 2px solid #FF7048;
        padding: 13px 11px;
        background: #FFF5F2;
    }

    /* List Rows (Material, Color, Exterior) */
    .v2-mobile-list-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border: 1px solid #E0E0E0;
        border-radius: 8px;
        margin-bottom: 8px;
        cursor: pointer;
        background: #fff;
    }
    .v2-mobile-list-row:active {
        background: #F9FAFB;
    }
    .v2-mobile-list-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
    }
    .v2-mobile-list-swatch {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        border: 1px solid #E0E0E0;
        background-size: cover;
        background-position: center;
        flex-shrink: 0;
    }
    .v2-mobile-list-icon {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #E0E0E0;
        border-radius: 6px;
        flex-shrink: 0;
    }
    .v2-mobile-list-text {
        font-size: 14px;
        font-weight: 600;
        color: #2B3B63;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .v2-mobile-list-badge {
        background: #F2F3F5;
        color: #FF7048;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 700;
        margin-left: 8px;
        flex-shrink: 0;
    }
    .v2-mobile-list-chevron {
        color: #5E6578;
        font-size: 16px;
        margin-left: 8px;
        flex-shrink: 0;
    }

    /* Phase 4: Bottom Sheet */
    .v2-mobile-bottom-sheet-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 99998;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }
    .v2-mobile-bottom-sheet-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }
    .v2-mobile-bottom-sheet {
        position: fixed;
        bottom: 0;
        left: 0; right: 0;
        background: #fff;
        border-radius: 16px 16px 0 0;
        z-index: 99999;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        transform: translateY(100%);
        transition: transform 0.3s ease;
    }
    .v2-mobile-bottom-sheet.active {
        transform: translateY(0);
    }
    .v2-mobile-bs-header {
        padding: 16px;
        border-bottom: 1px solid #E0E0E0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }
    .v2-mobile-bs-back {
        font-size: 14px;
        font-weight: 700;
        color: #2B3B63;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .v2-mobile-bs-title {
        font-size: 16px;
        font-weight: 700;
        color: #2B3B63;
        margin: 0;
    }
    .v2-mobile-bs-value {
        font-size: 14px;
        color: #5E6578;
    }
    .v2-mobile-bs-body {
        padding: 16px;
        overflow-y: auto;
        flex: 1;
        -webkit-overflow-scrolling: touch;
    }

    /* Phase 5: Shed Details */
    .v2-mobile-details-section {
        margin-top: 24px;
        border-top: 8px solid #F2F3F5;
        padding-top: 20px;
    }
    .v2-mobile-section-title {
        font-size: 18px;
        font-weight: 700;
        color: #2B3B63;
        margin-bottom: 16px;
    }
    .v2-mobile-detail-accordion {
        border-bottom: 1px solid #E0E0E0;
    }
    .v2-mobile-detail-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        color: #2B3B63;
    }
    .v2-mobile-detail-header .v2-detail-icon {
        font-size: 20px;
        color: #5E6578;
        transition: transform 0.2s;
    }
    .v2-mobile-detail-header.open .v2-detail-icon {
        transform: rotate(45deg);
    }
    .v2-mobile-detail-body {
        display: none;
        padding: 0 0 16px 0;
        font-size: 14px;
        color: #5E6578;
        line-height: 1.6;
    }

    /* Phase 6: Price Recap */
    .v2-mobile-recap-section {
        margin-top: 24px;
        border-top: 8px solid #F2F3F5;
        padding: 24px 0 120px 0;
        text-align: center;
    }
    .v2-mobile-recap-monthly {
        font-size: 14px;
        color: #5E6578;
        margin-bottom: 4px;
    }
    .v2-mobile-recap-monthly strong {
        color: #FF7048;
        font-size: 18px;
    }
    .v2-mobile-recap-see-details {
        color: #FF7048;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 16px;
        cursor: pointer;
    }
    .v2-mobile-recap-location {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 14px;
        color: #5E6578;
        margin-bottom: 20px;
    }
    .v2-mobile-recap-location strong {
        text-decoration: underline;
    }
    #v2-price-recap-submit {
        background-color: #FF7048;
        color: white;
        border: none;
        width: 100%;
        padding: 14px;
        border-radius: 25px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        margin-bottom: 12px;
    }
    #v2-price-recap-submit:active {
        background-color: #e5603a;
    }
    .v2-mobile-recap-save {
        color: #2B3B63;
        font-weight: 700;
        font-size: 14px;
        text-decoration: underline;
        cursor: pointer;
        display: inline-block;
    }

    /* Placeholder */
    .v2-mobile-placeholder {
        text-align: center;
        padding: 40px 20px;
        color: #5E6578;
        font-size: 14px;
    }
}

/* Desktop: hide all V2 mobile elements */
@media (min-width: 992px) {
    .v2-mobile-tabs-container,
    .v2-mobile-tab-contents,
    .v2-mobile-details-section,
    .v2-mobile-recap-section,
    .v2-mobile-bottom-sheet-overlay,
    .v2-mobile-bottom-sheet,
    #v2-bs-container {
        display: none !important;
    }
}
</style>

<script id="v2-mobile-js">
(function($) {
    if (window.innerWidth > 991) return;

    $(document).ready(function() {

        // ============================================================
        // PHASE 2: HORIZONTAL TAB BAR
        // ============================================================
        var tabs = ['Style', 'Size', 'Material', 'Color', 'Exterior', 'Interior', 'Upgrades'];
        var tabHtml = '<div class="v2-mobile-tabs-container"><div class="v2-mobile-tabs-scroll">';
        tabs.forEach(function(tab, index) {
            tabHtml += '<div class="v2-mobile-tab ' + (index === 0 ? 'active' : '') + '" data-tab="' + tab + '">' + tab + '</div>';
        });
        tabHtml += '</div></div><div class="v2-mobile-tab-contents"></div>';

        // Inject after wrap-price-add-to-cart
        $('.wrap-price-add-to-cart').after(tabHtml);

        var $contentContainer = $('.v2-mobile-tab-contents');
        tabs.forEach(function(tab, index) {
            $contentContainer.append('<div class="v2-mobile-tab-content-area ' + (index === 0 ? 'active' : '') + '" id="v2-tab-' + tab + '"></div>');
        });

        // Tab Switching
        $('.v2-mobile-tab').on('click', function() {
            $('.v2-mobile-tab').removeClass('active');
            $(this).addClass('active');
            var target = $(this).data('tab');
            $('.v2-mobile-tab-content-area').removeClass('active');
            $('#v2-tab-' + target).addClass('active');
            this.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        });

        // ============================================================
        // BOTTOM SHEET CONTAINER
        // ============================================================
        $('body').append('<div id="v2-bs-container"><div class="v2-mobile-bottom-sheet-overlay"></div></div>');

        function createBottomSheet(id, title, content, value) {
            var bs = '<div class="v2-mobile-bottom-sheet" id="v2-bs-' + id + '">' +
                '<div class="v2-mobile-bs-header">' +
                    '<div class="v2-mobile-bs-back">← ' + title + '</div>' +
                    '<span class="v2-mobile-bs-value">' + (value || '') + '</span>' +
                '</div>' +
                '<div class="v2-mobile-bs-body">' + content + '</div>' +
            '</div>';
            $('#v2-bs-container').append(bs);
        }

        function openBottomSheet(id) {
            $('.v2-mobile-bottom-sheet-overlay').addClass('active');
            $('#v2-bs-' + id).addClass('active');
        }

        function closeBottomSheet() {
            $('.v2-mobile-bottom-sheet-overlay').removeClass('active');
            $('.v2-mobile-bottom-sheet').removeClass('active');
        }

        $('body').on('click', '.v2-open-bs', function() {
            openBottomSheet($(this).data('bs-target'));
        });
        $('body').on('click', '.v2-mobile-bs-back, .v2-mobile-bottom-sheet-overlay', function() {
            closeBottomSheet();
        });

        // ============================================================
        // PHASE 3: TAB CONTENT - Populate after 3D configurator loads
        // ============================================================
        function buildAllTabs() {
            buildStyleTab();
            buildSizeTab();
            buildMaterialTab();
            buildColorTab();
            buildExteriorTab();
            buildInteriorTab();
            buildUpgradesTab();
            buildShedDetails();
            buildPriceRecap();
            setupStickyObserver();
        }

        // --- STYLE TAB ---
        function buildStyleTab() {
            var styleHtml = '<div class="v2-mobile-filter-row">';
            $('#shed-type-dropdown .dropdown-shed').each(function() {
                var name = $.trim($(this).text());
                var isAll = $(this).data('id') === 'all';
                styleHtml += '<div class="v2-mobile-filter-pill ' + (isAll ? 'active' : '') + '" data-type-id="' + $(this).data('id') + '">' + name + '</div>';
            });
            styleHtml += '</div><div class="v2-mobile-grid-4 v2-style-grid"></div>';
            $('#v2-tab-Style').html(styleHtml);
            populateStyleGrid();

            // Filter click
            $('#v2-tab-Style').on('click', '.v2-mobile-filter-pill', function() {
                $('#v2-tab-Style .v2-mobile-filter-pill').removeClass('active');
                $(this).addClass('active');
                // Trigger original type filter
                var typeId = $(this).data('type-id');
                $('#shed-type-dropdown .dropdown-shed[data-id="' + typeId + '"]').trigger('click');
                setTimeout(populateStyleGrid, 300);
            });

            // Card click
            $('#v2-tab-Style').on('click', '.v2-mobile-style-card', function() {
                var idx = $(this).data('index');
                var $opt = $('#ssb-configurator-accordion-style .ssb-option.display-thumbnail').eq(idx);
                $opt.find('a, span, img').first().trigger('click');
                $('.v2-mobile-style-card').removeClass('active');
                $(this).addClass('active');
            });
        }

        function populateStyleGrid() {
            var gridHtml = '';
            $('#ssb-configurator-accordion-style .ssb-option.display-thumbnail').each(function(index) {
                var name = $(this).find('.ssb-option-name').text();
                var imgSrc = $(this).find('img').attr('src');
                var isActive = $(this).hasClass('active');
                gridHtml += '<div class="v2-mobile-style-card ' + (isActive ? 'active' : '') + '" data-index="' + index + '">' +
                    '<img src="' + imgSrc + '" alt="' + name + '">' +
                    '<span>' + name + '</span>' +
                '</div>';
            });
            $('#v2-tab-Style .v2-style-grid').html(gridHtml);
        }

        // --- SIZE TAB ---
        function buildSizeTab() {
            var widthMap = {};
            $('#ssb-configurator-size-area option').each(function() {
                var w = $(this).data('size-width');
                if (w) {
                    if (!widthMap[w]) widthMap[w] = [];
                    widthMap[w].push({
                        val: $(this).val(),
                        text: $(this).text(),
                        selected: $(this).is(':selected')
                    });
                }
            });

            var widths = Object.keys(widthMap).sort(function(a, b) { return a - b; });
            var firstWidth = widths[0];

            var sizeHtml = '<div class="v2-mobile-filter-row">';
            widths.forEach(function(w, i) {
                sizeHtml += '<div class="v2-mobile-filter-pill ' + (i === 0 ? 'active' : '') + '" data-width="' + w + '">' + w + ' Wide</div>';
            });
            sizeHtml += '</div><div class="v2-mobile-size-grid" id="v2-size-grid"></div>';
            $('#v2-tab-Size').html(sizeHtml);

            function renderSizeGrid(width) {
                var items = widthMap[width] || [];
                var gridHtml = '';
                items.forEach(function(item) {
                    gridHtml += '<div class="v2-mobile-size-card ' + (item.selected ? 'active' : '') + '" data-val="' + item.val + '">' + item.text + '</div>';
                });
                $('#v2-size-grid').html(gridHtml);
            }

            if (firstWidth) renderSizeGrid(firstWidth);

            // Filter click
            $('#v2-tab-Size').on('click', '.v2-mobile-filter-pill', function() {
                $('#v2-tab-Size .v2-mobile-filter-pill').removeClass('active');
                $(this).addClass('active');
                renderSizeGrid($(this).data('width'));
            });

            // Size card click
            $('#v2-tab-Size').on('click', '.v2-mobile-size-card', function() {
                var val = $(this).data('val');
                $('#ssb-configurator-size-area').val(val).trigger('change');
                $('.v2-mobile-size-card').removeClass('active');
                $(this).addClass('active');
            });
        }

        // --- MATERIAL TAB ---
        function buildMaterialTab() {
            var matHtml = '';
            $('#ssb-configurator-accordion-materials .ssb-configurator-group').each(function(gIdx) {
                var title = $.trim($(this).find('.ssb-configurator-group-name').text());
                var $opts = $(this).find('.ssb-option');
                var $active = $(this).find('.ssb-option.active, .ssb-option input:checked').closest('.ssb-option').first();
                var activeName = $active.length ? $active.find('.ssb-option-name').text() : 'Default';
                var $thumb = $active.find('.ssb-thumbnail img, .ssb-option-swatch');
                var swatchStyle = '';
                if ($thumb.is('img')) {
                    swatchStyle = 'background-image: url(' + $thumb.attr('src') + '); background-size: cover;';
                } else if ($thumb.length) {
                    swatchStyle = $thumb.attr('style') || '';
                }

                matHtml += '<div class="v2-mobile-list-row v2-open-bs" data-bs-target="mat-' + gIdx + '">' +
                    '<div class="v2-mobile-list-left">' +
                        '<div class="v2-mobile-list-swatch" style="' + swatchStyle + '"></div>' +
                        '<div class="v2-mobile-list-text">' + title + ': ' + activeName + '</div>' +
                    '</div>' +
                    '<span class="v2-mobile-list-chevron">›</span>' +
                '</div>';

                // Build bottom sheet
                var bsContent = '<div class="v2-mobile-grid-4">';
                $opts.each(function(oIdx) {
                    var optName = $(this).find('.ssb-option-name').text();
                    var $oThumb = $(this).find('.ssb-thumbnail img');
                    var imgSrc = $oThumb.length ? $oThumb.attr('src') : '';
                    bsContent += '<div class="v2-mobile-style-card v2-bs-mat-opt" data-group="' + gIdx + '" data-opt="' + oIdx + '">' +
                        (imgSrc ? '<img src="' + imgSrc + '" alt="' + optName + '">' : '<div class="v2-mobile-list-swatch" style="width:100%;height:50px;border-radius:4px;"></div>') +
                        '<span>' + optName + '</span>' +
                    '</div>';
                });
                bsContent += '</div>';
                createBottomSheet('mat-' + gIdx, title, bsContent, activeName);
            });
            $('#v2-tab-Material').html(matHtml || '<div class="v2-mobile-placeholder">No material options available</div>');

            // Material option click in bottom sheet
            $('body').on('click', '.v2-bs-mat-opt', function() {
                var gIdx = $(this).data('group');
                var oIdx = $(this).data('opt');
                var $target = $('#ssb-configurator-accordion-materials .ssb-configurator-group').eq(gIdx).find('.ssb-option').eq(oIdx);
                $target.find('input, label, a, img').first().trigger('click');
                closeBottomSheet();
                setTimeout(buildMaterialTab, 500);
            });
        }

        // --- COLOR TAB ---
        function buildColorTab() {
            var colHtml = '';
            $('#ssb-configurator-accordion-colors .ssb-configurator-group').each(function(gIdx) {
                var $titleEl = $(this).find('.ssb-configurator-group-name');
                var title = $.trim($titleEl.clone().children().remove().end().text()) || $.trim($titleEl.text());
                var $active = $(this).find('.ssb-option.active, .ssb-option input:checked').closest('.ssb-option').first();
                if (!$active.length) $active = $(this).find('.ssb-option').first();
                var activeName = $active.find('.ssb-option-name').text() || 'Default';
                var $swatch = $active.find('.ssb-option-swatch');
                var bgColor = $swatch.length ? ($swatch.css('background-color') || '#ccc') : '#ccc';
                var bgImage = $swatch.length ? ($swatch.css('background-image') || '') : '';
                var swatchStyle = bgImage && bgImage !== 'none' ? 'background-image:' + bgImage + ';background-size:cover;' : 'background-color:' + bgColor + ';';

                // Determine if Premium
                var isPremium = $active.closest('.ssb-configurator-group').find('.ssb-configurator-group-name').text().toLowerCase().indexOf('premium') >= 0;
                var typeLabel = isPremium ? 'Premium' : 'Normal';

                colHtml += '<div class="v2-mobile-list-row v2-open-bs" data-bs-target="col-' + gIdx + '">' +
                    '<div class="v2-mobile-list-left">' +
                        '<div class="v2-mobile-list-swatch" style="' + swatchStyle + '"></div>' +
                        '<div class="v2-mobile-list-text">' + title + ': ' + activeName + '</div>' +
                    '</div>' +
                    '<span class="v2-mobile-list-chevron">›</span>' +
                '</div>';

                // Bottom sheet with filter and color grid
                var bsContent = '<div class="v2-mobile-filter-row">' +
                    '<div class="v2-mobile-filter-pill active" data-color-filter="all">All</div>' +
                    '<div class="v2-mobile-filter-pill" data-color-filter="normal">Normal</div>' +
                    '<div class="v2-mobile-filter-pill" data-color-filter="premium">Premium</div>' +
                '</div>';
                bsContent += '<div class="v2-mobile-grid-4 v2-color-grid" data-group="' + gIdx + '">';
                $(this).find('.ssb-option').each(function(oIdx) {
                    var optName = $(this).find('.ssb-option-name').text();
                    var $oSwatch = $(this).find('.ssb-option-swatch');
                    var oBg = $oSwatch.length ? ($oSwatch.css('background-color') || '#ccc') : '#ccc';
                    var oBgImg = $oSwatch.length ? ($oSwatch.css('background-image') || '') : '';
                    var oStyle = oBgImg && oBgImg !== 'none' ? 'background-image:' + oBgImg + ';background-size:cover;' : 'background-color:' + oBg + ';';
                    var isOActive = $(this).hasClass('active') || $(this).find('input:checked').length > 0;

                    bsContent += '<div class="v2-mobile-style-card v2-bs-col-opt ' + (isOActive ? 'active' : '') + '" data-group="' + gIdx + '" data-opt="' + oIdx + '">' +
                        '<div class="v2-mobile-list-swatch" style="width:100%;height:40px;border-radius:4px;' + oStyle + '"></div>' +
                        '<span>' + optName + '</span>' +
                    '</div>';
                });
                bsContent += '</div>';
                createBottomSheet('col-' + gIdx, title, bsContent, activeName);
            });
            $('#v2-tab-Color').html(colHtml || '<div class="v2-mobile-placeholder">No color options available</div>');

            // Color option click
            $('body').on('click', '.v2-bs-col-opt', function() {
                var gIdx = $(this).data('group');
                var oIdx = $(this).data('opt');
                var $target = $('#ssb-configurator-accordion-colors .ssb-configurator-group').eq(gIdx).find('.ssb-option').eq(oIdx);
                $target.find('input, label, a').first().trigger('click');
                closeBottomSheet();
                setTimeout(buildColorTab, 500);
            });
        }

        // --- EXTERIOR TAB ---
        function buildExteriorTab() {
            var extHtml = '';
            $('#ssb-configurator-accordion-upgrades .ssb-configurator-group').each(function(gIdx) {
                var $titleEl = $(this).find('.ssb-configurator-group-name');
                var title = $.trim($titleEl.clone().children().remove().end().text()) || $.trim($titleEl.text());
                var count = $(this).find('.ssb-option').length;
                var $countBadge = $titleEl.find('.ssb-option-upgrade-count');
                var badgeNum = $countBadge.length ? $countBadge.text() : count;

                extHtml += '<div class="v2-mobile-list-row v2-open-bs" data-bs-target="ext-' + gIdx + '">' +
                    '<div class="v2-mobile-list-left">' +
                        '<div class="v2-mobile-list-icon"><i class="icon ic-door" style="width:20px;height:20px;"></i></div>' +
                        '<div class="v2-mobile-list-text">' + title + '</div>' +
                        '<span class="v2-mobile-list-badge">' + badgeNum + '</span>' +
                    '</div>' +
                    '<span class="v2-mobile-list-chevron">›</span>' +
                '</div>';

                // Bottom sheet with options grid
                var bsContent = '<div class="v2-mobile-grid-4">';
                $(this).find('.ssb-option').each(function(oIdx) {
                    var optName = $(this).find('.ssb-option-name').text();
                    var $thumb = $(this).find('.ssb-thumbnail img');
                    var imgSrc = $thumb.length ? $thumb.attr('src') : '';
                    var isActive = $(this).hasClass('active');
                    bsContent += '<div class="v2-mobile-style-card v2-bs-ext-opt ' + (isActive ? 'active' : '') + '" data-group="' + gIdx + '" data-opt="' + oIdx + '">' +
                        (imgSrc ? '<img src="' + imgSrc + '" alt="' + optName + '">' : '') +
                        '<span>' + optName + '</span>' +
                    '</div>';
                });
                bsContent += '</div>';
                createBottomSheet('ext-' + gIdx, title, bsContent);
            });
            $('#v2-tab-Exterior').html(extHtml || '<div class="v2-mobile-placeholder">No exterior options available</div>');

            // Exterior option click
            $('body').on('click', '.v2-bs-ext-opt', function() {
                var gIdx = $(this).data('group');
                var oIdx = $(this).data('opt');
                var $target = $('#ssb-configurator-accordion-upgrades .ssb-configurator-group').eq(gIdx).find('.ssb-option').eq(oIdx);
                $target.find('input, label, a, .ssb-thumbnail').first().trigger('click');
                closeBottomSheet();
                setTimeout(buildExteriorTab, 500);
            });
        }

        // --- INTERIOR TAB ---
        function buildInteriorTab() {
            var content = $('#ssb-configurator-accordion-interior .ssb-configurator-panel-content').html();
            $('#v2-tab-Interior').html(content || '<div class="v2-mobile-placeholder">No interior options available</div>');
        }

        // --- UPGRADES TAB ---
        function buildUpgradesTab() {
            $('#v2-tab-Upgrades').html('<div class="v2-mobile-placeholder">Coming soon</div>');
        }

        // ============================================================
        // PHASE 5: SHED DETAILS
        // ============================================================
        function buildShedDetails() {
            var detailsHtml = '<div class="v2-mobile-details-section">' +
                '<h2 class="v2-mobile-section-title">Your Shed Details</h2>' +
                '<div style="margin-bottom:16px;"><span class="ssb-2d-floor-plan" style="color:#FF7048;font-weight:700;cursor:pointer;text-decoration:underline;">2D Floorplan</span></div>' +
                '<div class="v2-mobile-detail-accordion">' +
                    '<div class="v2-mobile-detail-header"><span>Structure details</span><span class="v2-detail-icon">+</span></div>' +
                    '<div class="v2-mobile-detail-body" id="v2-detail-structure"></div>' +
                '</div>' +
                '<div class="v2-mobile-detail-accordion">' +
                    '<div class="v2-mobile-detail-header"><span>Exteriors</span><span class="v2-detail-icon">+</span></div>' +
                    '<div class="v2-mobile-detail-body" id="v2-detail-exteriors"></div>' +
                '</div>' +
                '<div class="v2-mobile-detail-accordion">' +
                    '<div class="v2-mobile-detail-header"><span>Upgrades, Flooring & Interior</span><span class="v2-detail-icon">+</span></div>' +
                    '<div class="v2-mobile-detail-body" id="v2-detail-upgrades"></div>' +
                '</div>' +
            '</div>';
            $('.v2-mobile-tab-contents').after(detailsHtml);

            // Clone data from original shed details
            var $origDetail = $('#ssb-shed-detail .ssb-configurator-panel-content');
            if ($origDetail.length) {
                var structureHtml = '';
                $origDetail.find('#js-layout-content, #js-size-content, #js-siding-trim-content, #js-roof-content, #js-porch-content').each(function() {
                    structureHtml += $(this).prop('outerHTML');
                });
                $('#v2-detail-structure').html(structureHtml || 'Loading...');
                $('#v2-detail-exteriors').html($origDetail.find('#js-exterior-content').html() || 'Loading...');
                $('#v2-detail-upgrades').html(
                    ($origDetail.find('#js-interior-content').html() || '') +
                    ($origDetail.find('#js-credit-content').html() || '')
                    || 'Loading...'
                );
            }

            // Accordion toggle
            $('body').on('click', '.v2-mobile-detail-header', function() {
                $(this).toggleClass('open');
                $(this).next('.v2-mobile-detail-body').slideToggle(200);
            });
        }

        // ============================================================
        // PHASE 6: PRICE RECAP
        // ============================================================
        function buildPriceRecap() {
            var monthlyText = $('#amount-monthly-payment').text() || '$132.00';
            var locationText = $('.location-name').text() || 'Change Location';

            var recapHtml = '<div class="v2-mobile-recap-section" id="v2-price-recap">' +
                '<div class="v2-mobile-recap-monthly">Pay as low as: <strong>' + monthlyText + '/mo</strong></div>' +
                '<a class="v2-mobile-recap-see-details">See Details</a>' +
                '<div class="v2-mobile-recap-location">' +
                    '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 0C4.6868 0 2 2.6868 2 6C2 10.5 8 16 8 16C8 16 14 10.5 14 6C14 2.6868 11.3132 0 8 0ZM8 8.5C6.619 8.5 5.5 7.381 5.5 6C5.5 4.619 6.619 3.5 8 3.5C9.381 3.5 10.5 4.619 10.5 6C10.5 7.381 9.381 8.5 8 8.5Z" fill="#5E6578"/></svg>' +
                    'Delivery: <strong>' + locationText + '</strong>' +
                '</div>' +
                '<button id="v2-price-recap-submit">Submit Quote</button>' +
                '<div><span class="v2-mobile-recap-save">Save Model</span></div>' +
            '</div>';
            $('.v2-mobile-details-section').after(recapHtml);

            // Bind buttons
            $('#v2-price-recap-submit').on('click', function() {
                $('.group-button').trigger('click');
            });
            $('.v2-mobile-recap-save').on('click', function() {
                $('.ssb-save-btn').trigger('click');
            });
            $('.v2-mobile-recap-see-details').on('click', function() {
                $('#see-monthly-payment .see-details').trigger('click');
            });
        }

        // ============================================================
        // PHASE 7: STICKY BAR UPDATE
        // ============================================================
        function setupStickyObserver() {
            var recapEl = document.getElementById('v2-price-recap');
            var stickyFooter = document.getElementById('mobile-sticky-footer');

            if (recapEl && stickyFooter) {
                var recapObs = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            stickyFooter.classList.remove('visible');
                        }
                    });
                }, { threshold: 0.1 });
                recapObs.observe(recapEl);
            }
        }

        // ============================================================
        // INITIALIZE - Wait for 3D configurator to load
        // ============================================================
        var initInterval = setInterval(function() {
            if ($('#ssb-configurator-accordion-style .ssb-option').length > 0) {
                clearInterval(initInterval);
                buildAllTabs();
            }
        }, 500);

        // Fallback: build after 3 seconds even if not fully loaded
        setTimeout(function() {
            if ($('.v2-mobile-tab-contents .v2-mobile-tab-content-area').first().children().length === 0) {
                clearInterval(initInterval);
                buildAllTabs();
            }
        }, 3000);

    });
})(jQuery);
</script>
